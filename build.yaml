targets:
  $default:
    builders:
      drift_dev:
        options:
          # Dates en texte ISO-8601 (UTC, millisecondes) : précision suffisante
          # pour départager deux modifications (règle « maj_le le plus récent gagne »).
          store_date_time_values_as_text: true
          named_parameters: true
          # Instantanés du schéma pour écrire et tester les futures migrations :
          #   dart run drift_dev make-migrations
          databases:
            kassa: lib/data/db/kassa_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
